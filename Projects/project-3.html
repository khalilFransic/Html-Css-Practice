<html>

<head>
    <title>css project</title>
    <link rel="stylesheet" href="css/project-3.css">
</head>

<body>
    <h1>geeks for geeks survey form</h1>
    <form class="form">
        <div class="form-control">
            <label for="name" id="label-name">Name</label>
            <input type="text" id="name" placeholder="enter your name">
        </div>
        <div class="form-control">
            <label for="email" id="label-email">Email</label>
            <input type="email" id="email" placeholder="enter your email">
        </div>
        <div class="form-control">
            <label for="name" id="label-age">Age</label>
            <input type="text" id="age" placeholder="enter your age">
        </div>
        <div class="form-control">

            <label for="role" id=label-role>Which option best describes you?</label>
            <select name="role" id="role">
                <option value="Student">Student</option>
                <option value="internt">Internal</option>
                <option value="professional">professional</option>
                <option value="other">Other</option>
            </select>
        </div>
        <div class="form-control">
            <label>>Would you recommend GeeksforGeeks to a friend?</label>
            <label for="recommend-1">
                <input type="radio" id="recommend-1">yes
            </label> <label for="recommend-2">
                <input type="radio" id="recommend-2">no
            </label> <label for="recommend-3">
                <input type="radio" id="recommend-3">maybe
            </label>
        </div>
        <div class="form-control">
            <label>Languages and Frameworks known <small>(Check all that apply)</small></label>
            <label for="inp-1">
                <input type="checkbox">c
            </label>
            <label for="inp-2">
                <input type="checkbox" name="inp">C++
            </label>
            <label for="inp-3">
                <input type="checkbox" name="inp">C#
            </label>
            <label for="inp-4">
                <input type="checkbox" name="inp">Java
            </label>
            <label for="inp-5">
                <input type="checkbox" name="inp">Python
            </label>
            <label for="inp-6">
                <input type="checkbox" name="inp">JavaScript
            </label>
            <label for="inp-7">
                <input type="checkbox" name="inp">React
            </label>
            <label for="inp-8">
                <input type="checkbox" name="inp">Angular
            </label>
            <label for="inp-9">
                <input type="checkbox" name="inp">Django
            </label>
            <label for="inp-10">
                <input type="checkbox" name="inp">Spring
            </label>
        </div>
        <div class="form-control">
            <label for="comment">Any comments or suggestions</label> <textarea name="comment" id="comment" placeholder="Enter your comment here"></textarea>
        </div>
    </form>
</body>


</html>
